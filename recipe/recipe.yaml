schema_version: 1

context:
  version: 0.16.1
  build_number: '0'

package:
  name: python-barcode
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/p/python-barcode/python_barcode-${{ version }}.tar.gz
  sha256: 665ed09516b0088b5593061c5ac8662caa0b08d56bdad328388b1cab39939ac5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - python-barcode = barcode.pybarcode:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools_scm
  run:
    - python >=${{ python_min }}
    - pillow

tests:
  - python:
      imports:
        - barcode
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - '*'
    script:
      - python-barcode --help

about:
  license: MIT
  license_file: LICENCE
  summary: This library provides a simple way to create barcodes using only the Python standard lib
  homepage: http://github.com/WhyNotHugo/python-barcode
  repository: http://github.com/WhyNotHugo/python-barcode

extra:
  recipe-maintainers:
    - sodre
